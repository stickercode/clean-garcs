<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cognitive Sanctuary – Lexile Predictor</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="static/theme.css">
</head>
<body>
<div id="app" style="max-width:580px;margin:0 auto;padding:1.5rem;padding-bottom:5rem;"></div>

<script>

// ============================================================
// APP STATE
// ============================================================
const state = {
  screen: 'welcome',
  name: '', grade: null, passage: null,
  currentQuestion: null,
  userId: null,
  answers: [], currentQ: 0,
  readingStart: null, readingEnd: null,
  prediction: null,
  isLoading: false,
  answeredCount: 0,
  completedMessage: null,
  sessionId: null,
  questionLimit: 5
};

// ============================================================
// RENDER ENGINE
// ============================================================
const app = document.getElementById('app');
function render() {
  const screens = {
    welcome: renderWelcome, 
    questions: renderQuestions, 
    processing: renderProcessing,
    results: renderResults
  };
  screens[state.screen]();
}

// ---------- HEADER COMPONENT ----------
function headerHTML() {
  return `<div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:2rem;">
    <div style="width:2.5rem;height:2.5rem;border-radius:50%;background:var(--primary-container);display:flex;align-items:center;justify-content:center;">
      <span class="material-symbols-outlined" style="color:var(--primary);font-size:1.25rem;font-variation-settings:'FILL' 1;">auto_stories</span>
    </div>
    <span class="headline" style="font-size:1.25rem;font-weight:800;color:var(--primary);">Cognitive Sanctuary</span>
  </div>`;
}

// ---------- WELCOME SCREEN ----------
function renderWelcome() {
  app.innerHTML = `<div class="fade-in-up">
    ${headerHTML()}
    <div style="background:linear-gradient(135deg,var(--primary-container),#b3f5ec);border-radius:1.5rem;padding:2rem;margin-bottom:1.5rem;position:relative;overflow:hidden;">
      <div style="position:absolute;right:-1.5rem;top:-1.5rem;width:7rem;height:7rem;background:var(--primary);opacity:0.07;border-radius:50%;"></div>
      <div style="position:absolute;right:3rem;bottom:-1.5rem;width:4rem;height:4rem;background:var(--primary);opacity:0.07;border-radius:50%;"></div>
      <div style="font-size:2.75rem;margin-bottom:0.75rem;">📖</div>
      <h1 class="headline" style="font-size:1.875rem;font-weight:800;color:var(--on-surface);line-height:1.2;margin-bottom:0.625rem;">Find Your Lexile Level</h1>
      <p style="color:var(--on-surface-variant);font-size:0.875rem;line-height:1.7;max-width:90%;">Take a quick reading assessment and our adaptive engine will summarize your performance and guide your next steps.</p>
    </div>

    <div class="card" style="padding:1.5rem;margin-bottom:1.25rem;">
      <p class="headline" style="font-size:0.6875rem;font-weight:700;letter-spacing:0.08em;color:var(--on-surface-variant);margin-bottom:1rem;">HOW IT WORKS</p>
      <div style="display:flex;flex-direction:column;gap:1rem;">
        ${[
          ['📄','Read a passage','A short text matched to your grade level'],
          ['✏️','Answer 5 questions','Literal, inferential, vocabulary & main idea'],
          ['🤖','Get your reading summary','The adaptive engine reviews your responses and prepares a follow-up path'],
        ].map(([icon,title,desc])=>`<div style="display:flex;align-items:center;gap:0.875rem;">
          <div style="width:2.75rem;height:2.75rem;border-radius:0.875rem;background:var(--surface-container);display:flex;align-items:center;justify-content:center;font-size:1.375rem;flex-shrink:0;">${icon}</div>
          <div><div style="font-weight:700;font-size:0.875rem;">${title}</div><div style="color:var(--on-surface-variant);font-size:0.75rem;margin-top:0.125rem;">${desc}</div></div>
        </div>`).join('')}
      </div>
    </div>

    

    <button class="btn-primary" style="width:100%;font-size:1rem;" onclick="startAssessment()">
      Start Assessment <span class="material-symbols-outlined" style="font-size:1.25rem;">arrow_forward</span>
    </button>
    <p style="text-align:center;color:var(--on-surface-variant);font-size:0.75rem;margin-top:0.875rem;">Takes about 5–10 minutes · No account needed</p>
  </div>`;
}


// ---------- QUESTIONS SCREEN ----------
function renderQuestions() {
  const q = state.currentQuestion;
  if (!q) {
    app.innerHTML = `<div class="fade-in-up">${headerHTML()}<div class="card" style="padding:1.5rem;">No question is available right now.</div></div>`;
    return;
  }

  const sel = state.answers[0] !== undefined ? state.answers[0] : null;
  const typeMeta = {
    literal:   { label:'📖 Literal',   bg:'var(--secondary-container)', color:'var(--on-secondary-container)' },
    inferential:{ label:'🧠 Inferential', bg:'#ede9fe', color:'#5b21b6' },
    vocabulary: { label:'📝 Vocabulary', bg:'var(--tertiary-container)', color:'var(--on-tertiary-container)' },
    main_idea:  { label:'🎯 Main Idea',  bg:'#fce7f3', color:'#9d174d' },
  };
  const tm = typeMeta[q.type] || typeMeta.literal;

  app.innerHTML = `<div class="fade-in-up">
    ${headerHTML()}
    ${state.passage ? `<div class="card" style="padding:1.25rem;margin-bottom:1rem;">
      <div style="font-size:0.75rem;font-weight:700;color:var(--primary);margin-bottom:0.5rem;">${state.passage.title || 'Passage'}</div>
      <div style="font-size:0.875rem;line-height:1.6;color:var(--on-surface-variant);">${(state.passage.text || '').split('\n\n').map(para=>`<p style="margin-bottom:0.75rem;">${para}</p>`).join('')}</div>
    </div>` : ''}
    <div style="margin-bottom:1.25rem;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;">
        <span style="font-size:0.75rem;font-weight:700;color:var(--on-surface-variant);">Adaptive Question</span>
        <span style="font-size:0.75rem;font-weight:700;color:var(--primary);">Live from the backend</span>
      </div>
    </div>

    <div style="display:inline-flex;align-items:center;background:${tm.bg};color:${tm.color};padding:0.375rem 0.875rem;border-radius:9999px;font-size:0.75rem;font-weight:700;margin-bottom:1rem;">${tm.label}</div>

    <div class="card" style="padding:1.5rem;margin-bottom:1.25rem;">
      <p style="font-size:1.0625rem;font-weight:600;line-height:1.65;margin:0;">${q.q}</p>
    </div>

    <div style="display:flex;flex-direction:column;gap:0.75rem;margin-bottom:1.5rem;">
      ${q.choices.map((c,i)=>`
        <button class="choice-btn${sel===i?' selected':''}" onclick="selectAnswer(${i})">
          <span style="width:1.75rem;height:1.75rem;border-radius:50%;border:2px solid ${sel===i?'var(--primary)':'var(--outline-variant)'};display:inline-flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;flex-shrink:0;background:${sel===i?'var(--primary)':'transparent'};color:${sel===i?'var(--on-primary)':'var(--on-surface-variant)'};">${String.fromCharCode(65+i)}</span>
          <span>${c}</span>
        </button>
      `).join('')}
    </div>

    <button class="btn-primary" style="width:100%;" ${sel===null?'disabled':''} onclick="nextQuestion()">
      Submit Answer →
    </button>
  </div>`;
}

// ---------- PROCESSING SCREEN ----------
function renderProcessing() {
  app.innerHTML = `<div class="fade-in-up" style="text-align:center;padding:1rem 0;">
    <div style="font-size:3rem;margin-bottom:1rem;">🤖</div>
    <h2 class="headline" style="font-size:1.5rem;font-weight:800;margin-bottom:0.5rem;">Analyzing Your Reading</h2>
    <p style="color:var(--on-surface-variant);font-size:0.875rem;margin-bottom:2rem;line-height:1.6;">The adaptive engine is processing your responses and preparing your next step.</p>

    <div class="card" style="padding:1.5rem;margin-bottom:1.25rem;text-align:left;">
      <p class="headline" style="font-size:0.6875rem;font-weight:700;letter-spacing:0.08em;color:var(--on-surface-variant);margin-bottom:1rem;">STATUS</p>
      <div style="display:flex;flex-direction:column;gap:0.5rem;font-size:0.8125rem;">
        <div style="display:flex;align-items:center;gap:0.5rem;color:var(--on-surface);"><span style="color:#059669;font-weight:700;">✓</span>Responses received</div>
        <div style="display:flex;align-items:center;gap:0.5rem;color:var(--on-surface);"><span style="color:#059669;font-weight:700;">✓</span>Adaptive logic running</div>
      </div>
    </div>
  </div>`;

  setTimeout(() => {
    state.screen = 'results';
    render();
  }, 900);
}

// ---------- RESULTS SCREEN ----------
function renderResults() {
  const p = state.prediction || {};
  const name = state.name || 'Student';
  const summary = {
    title: `Great job, ${name}!`,
    subtitle: 'Your adaptive assessment is complete.',
    message: state.completedMessage || 'You completed the available questions.',
    label: p.label || 'Assessment complete',
    range: p.range || 'Adaptive assessment',
    gradeEq: p.gradeEq || 'Ready for the next challenge',
    lexile: p.lexile || null,
    strengths: Array.isArray(p.strengths) ? p.strengths : [],
    growthAreas: Array.isArray(p.growthAreas) ? p.growthAreas : []
  };

  app.innerHTML = `<div class="fade-in-up">
    ${headerHTML()}
    <div style="text-align:center;margin-bottom:1.5rem;">
      <div style="font-size:2.5rem;margin-bottom:0.5rem;">🎉</div>
      <h2 class="headline" style="font-size:1.5rem;font-weight:800;margin-bottom:0.25rem;">${summary.title}</h2>
      <p style="color:var(--on-surface-variant);font-size:0.875rem;">${summary.subtitle}</p>
    </div>

    <div style="background:linear-gradient(135deg,var(--primary),var(--primary-dim));border-radius:1.5rem;padding:2rem;margin-bottom:1.5rem;text-align:center;position:relative;overflow:hidden;">
      <div style="position:absolute;right:-2rem;top:-2rem;width:8rem;height:8rem;background:white;opacity:0.05;border-radius:50%;"></div>
      <div style="position:absolute;left:-1rem;bottom:-2rem;width:5rem;height:5rem;background:white;opacity:0.05;border-radius:50%;"></div>
      <div style="background:rgba(255,255,255,0.15);display:inline-block;padding:0.375rem 1.125rem;border-radius:9999px;font-size:0.8125rem;font-weight:700;color:white;margin-bottom:0.875rem;">${summary.label}</div>
      <p style="color:rgba(255,255,255,0.85);font-size:0.875rem;margin-bottom:0.25rem;">${summary.message}</p>
      <p style="color:rgba(255,255,255,0.6);font-size:0.75rem;">Answered ${state.answeredCount} of ${state.questionLimit} questions</p>
      ${summary.lexile ? `<p style="color:rgba(255,255,255,0.6);font-size:0.75rem;">${summary.gradeEq} · ${summary.range}</p>` : ''}
    </div>

    ${(summary.strengths.length || summary.growthAreas.length) ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:0.875rem;margin-bottom:1.25rem;">
      ${summary.strengths.length ? `<div style="background:#d1fae5;border-radius:1rem;padding:1rem;">
        <div style="font-size:0.6875rem;font-weight:800;color:#059669;letter-spacing:0.06em;margin-bottom:0.5rem;">💪 STRENGTHS</div>
        ${summary.strengths.map(s=>`<div style="font-size:0.75rem;color:#065f46;font-weight:600;line-height:1.5;">• ${s}</div>`).join('')}
      </div>` : ''}
      ${summary.growthAreas.length ? `<div style="background:#fef3c7;border-radius:1rem;padding:1rem;">
        <div style="font-size:0.6875rem;font-weight:800;color:#d97706;letter-spacing:0.06em;margin-bottom:0.5rem;">🌱 GROWTH</div>
        ${summary.growthAreas.map(s=>`<div style="font-size:0.75rem;color:#92400e;font-weight:600;line-height:1.5;">• ${s}</div>`).join('')}
      </div>` : ''}
    </div>` : ''}

    <div class="card" style="padding:1.5rem;margin-bottom:1.25rem;">
      <h3 class="headline" style="font-size:1rem;font-weight:700;margin-bottom:0.75rem;">Next steps</h3>
      <p style="font-size:0.8125rem;color:var(--on-surface-variant);line-height:1.6;margin:0;">Continue practicing with more adaptive questions or browse the library for reading material that fits your current level.</p>
    </div>

    <div style="display:flex;flex-direction:column;gap:0.75rem;">
      <button class="btn-primary" style="width:100%;" onclick="resetApp()">Start Another Assessment</button>
      <button class="btn-outline" style="width:100%;" onclick="goToLibrary()">Open Library</button>
    </div>
  </div>`;
}

// ============================================================
// EVENT HANDLERS
// ============================================================
async function loadNextQuestion() {
  const savedStudent = localStorage.getItem('garcs_student');
  let student = null;

  if (savedStudent) {
    try {
      student = JSON.parse(savedStudent);
    } catch (err) {
      console.error(err);
    }
  }

  const studentId = student?.student_id || state.userId;

  if (!studentId) {
    window.location.href = '/login';
    return false;
  }

  state.userId = studentId;
  state.isLoading = true;

  app.innerHTML = `
    <div class="fade-in-up" style="text-align:center;padding:2rem 0;">
      ${headerHTML()}
      <p style="color:var(--on-surface-variant);">
        Loading your next adaptive question…
      </p>
    </div>
  `;

  try {

    // ============================================================
    // START A NEW ASSESSMENT SESSION IF NEEDED
    // ============================================================
    if (!state.sessionId) {
      const sessionRes = await fetch('/api/session/start', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          student_id: studentId
        })
      });

      if (!sessionRes.ok) {
        const payload = await sessionRes.json().catch(() => ({}));

        throw new Error(
          payload.error || 'Unable to start assessment.'
        );
      }

      const sessionPayload = await sessionRes.json();

      state.sessionId = sessionPayload.session_id;
      state.questionLimit = sessionPayload.question_limit || 5;
      state.answeredCount = 0;
    }

    // ============================================================
    // ASK BACKEND FOR NEXT ADAPTIVE QUESTION
    // ============================================================
    const questionRes = await fetch(
      `/api/question/next?student_id=${encodeURIComponent(studentId)}&session_id=${encodeURIComponent(state.sessionId)}`
    );

    if (!questionRes.ok) {
      const payload = await questionRes.json().catch(() => ({}));

      throw new Error(
        payload.error || 'Unable to load the next question.'
      );
    }

    const payload = await questionRes.json();

    // ============================================================
    // ASSESSMENT COMPLETE
    // ============================================================
    if (payload.done) {
      state.currentQuestion = null;

      state.completedMessage =
        payload.message ||
        'You have completed the available questions.';

      state.prediction = null;
      state.screen = 'results';

      render();
      return false;
    }

    // ============================================================
    // UPDATE QUESTION COUNT FROM BACKEND
    // ============================================================
    if (payload.question_number) {
      state.answeredCount = payload.question_number - 1;
    }

    if (payload.question_limit) {
      state.questionLimit = payload.question_limit;
    }

    // ============================================================
    // PASSAGE HANDLING
    //
    // IMPORTANT:
    // Only replace the displayed passage when the backend says
    // this question starts a NEW passage.
    //
    // Q1 -> Passage 1 -> new_passage = true
    // Q2 -> Passage 1 -> new_passage = false
    // Q3 -> Passage 1 -> new_passage = false
    // Q4 -> Passage 1 -> new_passage = false
    // Q5 -> Passage 1 -> new_passage = false
    // Q6 -> Passage 2 -> new_passage = true
    // ============================================================
    if (payload.new_passage || !state.passage) {

      if (payload.passage) {
        state.passage = {
          id: payload.passage.id,
          title: payload.passage.title || 'Reading Passage',
          text: payload.passage.body || '',
          genre: 'Reading',
          genreEmoji: '📖',
          wordCount: Math.max(
            60,
            (payload.passage.body || '')
              .split(/\s+/)
              .filter(Boolean)
              .length
          )
        };
      }

      // Start reading timer only when a new passage appears.
      state.readingStart = Date.now();
    }

    // ============================================================
    // STORE CURRENT QUESTION
    // ============================================================
    state.currentQuestion = {
      id: payload.question_id,
      q: payload.prompt,
      choices: payload.choices || [],

      type: {
        literal: 'literal',
        inferential: 'inferential',
        critical: 'main_idea',
        main_idea: 'main_idea',
        vocabulary: 'vocabulary'
      }[payload.skill_tag] || 'literal',

      skill_tag: payload.skill_tag,
      difficulty: payload.difficulty
    };

    // Each question gets its own answer selection.
    state.answers = [];
    state.currentQ = 0;

    state.screen = 'questions';

    return true;

  } catch (err) {

    console.error(err);

    alert(
      err.message ||
      'Could not load the next question.'
    );

    return false;

  } finally {

    state.isLoading = false;

  }
}

async function startAssessment() {
  state.name = state.name || 'Student';
  const loaded = await loadNextQuestion();
  if (loaded) {
    state.screen = 'questions';
    render();
  }
}

function selectAnswer(i) {
  state.answers[0] = i;
  render();
}

async function nextQuestion() {
  if (state.answers[0] === undefined) return;

  try {
    const response = await fetch('/api/answer', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        student_id: state.userId,
        session_id: state.sessionId,
        question_id: state.currentQuestion?.id,
        chosen_index: state.answers[0],

        response_time_sec: Math.max(
          0,
          Math.round(
            (Date.now() - (state.readingStart || Date.now())) / 1000
          )
        ),

        reread_count: 0
      })
    });

    if (!response.ok) {
      const payload = await response.json().catch(() => ({}));

      throw new Error(
        payload.error ||
        'Unable to save your answer.'
      );
    }

    const answerPayload = await response.json();

    // The backend increments AssessmentSession.question_count.
    state.answeredCount += 1;

    // ============================================================
    // ASSESSMENT HAS REACHED THE 5-QUESTION LIMIT
    // ============================================================
    if (state.answeredCount >= state.questionLimit) {

      state.currentQuestion = null;

      state.completedMessage =
        'Assessment complete. You answered 5 questions.';

      state.screen = 'results';

      render();
      return;
    }

    // ============================================================
    // LOAD THE NEXT ADAPTIVE QUESTION
    // ============================================================
    const loaded = await loadNextQuestion();

    if (loaded && state.screen === 'questions') {
      render();
    }

  } catch (err) {

    console.error(err);

    alert(
      err.message ||
      'Could not save your answer.'
    );
  }
}

function prevQuestion() {
  if (state.currentQ>0) { state.currentQ--; render(); }
}

function resetApp() {
  state.screen = 'welcome';
  state.answers = [];
  state.currentQ = 0;
  state.prediction = null;
  state.passage = null;
  state.answeredCount = 0;
  state.completedMessage = null;

  // IMPORTANT: force the next assessment to create a new session
  state.sessionId = null;
  state.questionLimit = 5;

  render();
}

function goToLibrary() {
  window.location.href = '/library';
}

// ============================================================
// INIT
// ============================================================
render();
</script>
</body>
</html>
