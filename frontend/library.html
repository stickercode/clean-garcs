<script>
  const settingsBtn = document.getElementById('settingsBtn');
  const dropdown = document.getElementById('settingsDropdown');

  settingsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    dropdown.classList.toggle('hidden');
  });

  // Close when clicking anywhere else
  document.addEventListener('click', () => {
    dropdown.classList.add('hidden');
  });

  // (Optional) Close after clicking an item
  dropdown.addEventListener('click', () => {
    dropdown.classList.add('hidden');
  });

  function logout() {
    localStorage.removeItem('garcs_student');
    window.location.href = '/login';
  }

  async function loadPassages() {
    try {
        const student = JSON.parse(
            localStorage.getItem("garcs_student") || "{}"
        );

        const studentId = student.student_id;

        if (!studentId) {
            throw new Error("Student ID not found");
        }

        const response = await fetch(
           `/api/library/books?student_id=${encodeURIComponent(studentId)}`
        );

        if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));

            throw new Error(
                errorData.error || `Failed to load passages (${response.status})`
            );
        }

        const passages = await response.json();

        renderPassages(passages);

    } catch (error) {
        console.error("Error loading passages:", error);

        document.getElementById("passageGrid").innerHTML = `
            <p class="text-red-600">
                Unable to load the library.
            </p>
        `;
    }
}

  function renderPassages(passages) {
    const grid = document.getElementById("passageGrid");

    grid.innerHTML = "";

    passages.forEach(passage => {
        const card = document.createElement("div");

        card.className =
            "bg-surface-container-lowest p-4 rounded-lg " +
            "flex gap-4 hover:bg-surface-bright transition-colors " +
            "cursor-pointer shadow-sm";

        card.innerHTML = `
            <div class="w-24 h-32 rounded-md overflow-hidden flex-none shadow-md">
                <img
                    src="${passage.cover_image || '/static/images/default-book.jpg'}"
                    alt="${passage.title}"
                    class="w-full h-full object-cover"
                >
            </div>

            <div class="flex flex-col justify-center flex-1">

                <span class="text-[10px] font-bold text-primary uppercase tracking-widest mb-1">
                    ${passage.category || "Reading"}
                </span>

                <h4 class="font-headline font-bold text-on-surface text-base">
                    ${passage.title}
                </h4>

                <p class="text-on-surface-variant font-body text-xs mt-1 mb-3 line-clamp-2">
                    ${passage.description || ""}
                </p>

                <div class="flex items-center gap-2 flex-wrap">

                    <span class="px-2 py-0.5 bg-surface-container text-on-primary-container text-[10px] font-bold rounded-full">
                        ${passage.grade_band}
                    </span>

                    <span class="text-[10px] text-outline">
                        ${passage.chapter_count} chapters
                    </span>

                </div>

                <div class="mt-3">

                    <div class="flex justify-between text-[10px] mb-1">
                        <span class="text-outline">
                            ${passage.completion_state}
                        </span>

                        <span class="font-bold">
                            ${passage.progress_percent}%
                        </span>
                    </div>

                    <div class="w-full h-2 bg-surface-container rounded-full overflow-hidden">
                        <div
                            class="h-full bg-primary rounded-full"
                            style="width: ${passage.progress_percent}%"
                        ></div>
                    </div>

                </div>

            </div>
        `;

        card.addEventListener("click", () => {
            window.location.href =
                `/reading.html?passage_id=${passage.id}`;
        });

        grid.appendChild(card);
    });
}

  // Load passages when the page is ready
  document.addEventListener("DOMContentLoaded", loadPassages);
</script>
